[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "diremoe"
version = "0.1.0"
description = "Directional residual dual-expert classification of brain recordings"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.2", "torch>=2.6"]

[project.optional-dependencies]
mantis = ["mantis-tsfm==1.0.0"]

[project.scripts]
diremoe = "diremoe.cli:main"

[tool.setuptools.packages.find]
include = ["diremoe"]
